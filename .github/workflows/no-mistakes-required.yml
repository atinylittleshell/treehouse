name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

# No paths / paths-ignore filter here, deliberately. This workflow backs a
# required status check, and a path-filtered required check never reports at
# all, leaving the PR blocked on a status that can never arrive.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    steps:
      # The enforcement itself now lives in the shared composite action in the
      # no-mistakes repository, so this repository no longer carries its own
      # copy of the decision logic to drift. The action never checks out or
      # executes repository code, so the base-branch checkout this job used to
      # perform is no longer needed.
      #
      # Pinned to an immutable commit, never @main: main is editable by the very
      # pull request this gate is judging. Bumping the pin is a separate,
      # deliberate pull request.
      #
      # The bot exemptions are passed as action inputs rather than a job-level
      # `if:`. This workflow backs a REQUIRED status check, and a skipped job
      # never reports the context, which would block the PR on a status that
      # can never arrive - the same reason the trigger carries no path filter above.
      # Passing them as inputs keeps the job running and reporting success.
      # The pull_request/synchronize payload does not always include the PR body,
      # so the shared action cannot rely on GITHUB_EVENT_PATH for that fact. Fetch
      # the current body from the GitHub API so the gate always judges the actual
      # PR description.
      - name: Fetch current PR body
        id: pr-body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" | python3 -c "import json,sys; body=json.load(sys.stdin).get('body'); sys.stdout.write('' if body is None else body)")
          delim="PRBODYEOF_$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          while printf '%s\n' "$body" | grep -qxF "$delim"; do
            delim="PRBODYEOF_$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          done
          {
            echo "body<<$delim"
            printf '%s\n' "$body"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

      - name: Verify no-mistakes signature and pipeline attestation in PR body
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@32d396ac0f29135daf7fcb9964aba9d5f4e796d6 # post-v1.57.1, untagged (action added in #819)
        with:
          pr-body: ${{ steps.pr-body.outputs.body }}
          pr-head-sha: ${{ github.event.pull_request.head.sha }}
          pr-head-ref: ${{ github.event.pull_request.head.ref }}
          pr-author: ${{ github.event.pull_request.user.login }}
          pr-number: ${{ github.event.pull_request.number }}
          exempt-authors: |
            github-actions[bot]
            dependabot[bot]
